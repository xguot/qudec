[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qudec"
version = "0.1.0"
description = "GPU-accelerated quantum error correction decoders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
